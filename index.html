<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<meta name="description" content="Chatly — your personal messages.">
<title>Chatly</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;--bg:#f4f5f9;--panel:#fff;--soft:#f0f1f6;--line:#e7e8ef;--text:#20212a;--muted:#858997;--blue:#1685f8;--blue2:#0878ed;--bubble:#e9eaf0;--shadow:0 12px 40px #1d2a4510}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.auth{height:100dvh;min-height:0;display:grid;place-items:center;overflow-y:auto;padding:22px;background:radial-gradient(ellipse at 50% 0,#dcecff 0,transparent 55%),var(--bg)}
.auth-card{width:min(420px,100%);background:var(--panel);padding:30px;border-radius:25px;box-shadow:var(--shadow)}
.brand{font-weight:850;font-size:31px;letter-spacing:-1.6px}
.brand span{color:var(--blue)}
.auth-card h1{margin:18px 0 5px;font-size:25px}
.auth-card p{line-height:1.5}
.stack{display:grid;gap:11px;margin-top:20px}
.field{width:100%;border:1px solid var(--line);background:var(--soft);padding:13px 15px;border-radius:13px;outline:none;color:var(--text)}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1685f81a}
.primary{background:var(--blue);color:#fff;padding:13px 17px;border-radius:13px;font-weight:700}
.primary:hover{background:var(--blue2)}
.text-btn{background:transparent;color:var(--blue);font-weight:650;padding:8px}

/* Main app: lock the viewport so only the intended panels scroll. */
.app{height:100vh;height:100dvh;min-height:0;max-height:100dvh;display:grid;grid-template-columns:340px minmax(0,1fr);max-width:1500px;margin:0 auto;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.list-pane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;background:var(--panel)}
.list-head{padding:24px 20px 15px;display:flex;align-items:center;gap:10px;flex:none}
.list-head .brand{font-size:27px}
.list-head .spacer{flex:1}
.round-btn{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--text);font-size:19px;display:grid;place-items:center;flex:none}
.search-wrap{padding:0 16px 13px;flex:none}
.search{width:100%;border:0;border-radius:12px;background:var(--soft);padding:11px 13px;outline:none;color:var(--text)}
.list-label{padding:9px 20px 7px;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.1em;flex:none}
.conversation-list{overflow-x:hidden;overflow-y:auto;flex:1 1 0;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.conversation{display:flex;align-items:center;gap:12px;padding:12px 17px;cursor:pointer;border-left:3px solid transparent}
.conversation:hover{background:#f7f8fb}
.conversation.active{background:#eef5ff;border-left-color:var(--blue)}
.avatar{width:48px;height:48px;border-radius:50%;background:#dceaff;color:#176bc0;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.conv-copy{min-width:0;flex:1;border-bottom:1px solid var(--line);padding:2px 0 12px}
.conv-top{display:flex;align-items:center;gap:8px}
.conv-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.conv-time{font-size:11px;color:var(--muted);white-space:nowrap}
.conv-preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.profile-footer{border-top:1px solid var(--line);padding:12px 15px;display:flex;align-items:center;gap:10px;flex:none}
.profile-footer .avatar{width:38px;height:38px}
.profile-copy{min-width:0;flex:1}
.profile-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-actions{display:flex;gap:4px;flex:none}

.chat-pane{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;background:var(--panel);position:relative}
.empty{flex:1;min-height:0;display:grid;place-items:center;text-align:center;padding:25px;color:var(--muted)}
.empty-icon{width:76px;height:76px;border-radius:25px;background:#eaf3ff;color:var(--blue);display:grid;place-items:center;font-size:36px;margin:0 auto 18px}
.chat-head{height:72px;min-height:72px;flex:0 0 72px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px}
.chat-head .avatar{width:42px;height:42px}
.chat-person{font-weight:750}
.chat-status{font-size:12px;color:var(--muted);margin-top:3px}
.chat-head .spacer{flex:1}
.messages{flex:1 1 0;min-height:0;height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:22px clamp(14px,4vw,54px);display:flex;flex-direction:column;gap:7px;scrollbar-gutter:stable}
.day-divider{text-align:center;color:var(--muted);font-size:11px;margin:12px 0 16px}
.message-row{display:flex;flex-direction:column;max-width:min(72%,620px);align-self:flex-start;gap:3px}
.message-row.mine{align-self:flex-end;align-items:flex-end}
.bubble{background:var(--bubble);padding:10px 15px;border-radius:20px 20px 20px 6px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.mine .bubble{background:var(--blue);color:white;border-radius:20px 20px 6px 20px}
.message-time{font-size:10px;color:var(--muted);padding:0 7px}
.composer-area{padding:12px clamp(12px,4vw,48px) max(15px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:9px;flex:0 0 auto}
.composer{flex:1;min-width:0;display:flex;align-items:flex-end;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:23px;padding:7px 9px 7px 15px}
.composer textarea{resize:none;max-height:120px;min-height:34px;flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);padding:7px 0;line-height:1.35}
.send{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;font-size:17px;flex:none}
.attach{background:transparent;color:var(--blue);font-size:22px;padding:4px}
.mobile-back{display:none}

.modal-back{position:fixed;inset:0;background:#11182766;display:grid;place-items:center;padding:18px;z-index:5;overflow-y:auto}
.modal{width:min(430px,100%);background:var(--panel);border-radius:22px;padding:23px;box-shadow:0 20px 80px #0003;display:grid;gap:13px}
.modal h2{margin:0 0 3px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.secondary{background:var(--soft);color:var(--text);padding:11px 15px;border-radius:12px}
.avatar-preview{width:76px;height:76px;border-radius:50%;margin:auto}
.theme-row{display:flex;gap:8px}
.theme-choice{flex:1;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text)}
.theme-choice.selected{border-color:var(--blue)}
body.dark{--bg:#111318;--panel:#1b1d24;--soft:#282b34;--line:#333640;--text:#f2f3f7;--muted:#a1a5b1;--bubble:#30343e;--shadow:0 12px 40px #0003}
body.dark .conversation:hover{background:#252832}
body.dark .conversation.active{background:#1c3553}
body.dark .empty-icon{background:#1d3551}
body.dark .auth{background:radial-gradient(ellipse at 50% 0,#1b3554 0,transparent 55%),var(--bg)}

@media(max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);width:100%;height:100vh;height:100dvh}
  .list-pane{grid-column:1;grid-row:1}
  .chat-pane{display:none;grid-column:1;grid-row:1}
  .app.chat-open .list-pane{display:none}
  .app.chat-open .chat-pane{display:flex}
  .list-head{padding:16px 17px 12px}
  .list-head .brand{font-size:25px}
  .chat-head{height:64px;min-height:64px;flex-basis:64px;padding:0 13px}
  .mobile-back{display:grid}
  .messages{padding:16px 12px}
  .message-row{max-width:86%}
  .composer-area{padding:9px 10px max(12px,env(safe-area-inset-bottom))}
  .profile-footer{padding-bottom:max(12px,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="auth" class="auth">
  <section class="auth-card">
    <div class="brand">chat<span>ly</span></div>
    <h1 id="authTitle">Your conversations, together.</h1>
    <p class="muted" id="authSubtitle">Sign in to your Chatly account.</p>
    <form id="authForm" class="stack">
      <input class="field" id="email" type="email" placeholder="Email address" autocomplete="email" required>
      <input class="field hidden" id="username" placeholder="Username (3–24 characters)" minlength="3" maxlength="24" autocomplete="username">
      <input class="field" id="password" type="password" placeholder="Password (at least 6 characters)" minlength="6" autocomplete="current-password" required>
      <button class="primary" id="authSubmit">Sign in</button>
    </form>
    <p class="small muted" style="text-align:center;margin:17px 0 0"><span id="switchText">New to Chatly?</span> <a href="#" id="authSwitch" style="color:var(--blue);font-weight:700">Create an account</a></p>
    <p id="authError" class="small" style="color:#d84a5b"></p>
  </section>
</div>
<div id="app" class="app hidden">
  <aside class="list-pane">
    <header class="list-head"><div class="brand">chat<span>ly</span></div><div class="spacer"></div><button class="round-btn" id="newChat" title="New message">＋</button></header>
    <div class="search-wrap"><input class="search" id="searchChats" placeholder="Search conversations"></div>
    <div class="list-label">Messages</div>
    <div class="conversation-list" id="conversationList"><div class="empty">Your conversations will appear here.</div></div>
    <footer class="profile-footer">
      <div class="avatar" id="myAvatar">?</div>
      <div class="profile-copy"><div class="profile-name" id="myName">Your profile</div><div class="small muted">Your account</div></div>
      <div class="profile-actions"><button class="round-btn" id="settings" title="Customize">⚙</button><button class="round-btn" id="signOut" title="Sign out">↪</button></div>
    </footer>
  </aside>
  <main class="chat-pane" id="chatPane">
    <section class="empty" id="emptyState"><div><div class="empty-icon">✉</div><h2 style="color:var(--text)">Your messages</h2><p>Choose a conversation or start a new one.</p><button class="primary" id="emptyNewChat">New message</button></div></section>
    <header class="chat-head hidden" id="chatHead">
      <button class="round-btn mobile-back" id="backToChats" aria-label="Back">‹</button>
      <div class="avatar" id="chatAvatar">?</div>
      <div><div class="chat-person" id="chatName"></div><div class="chat-status" id="chatStatus">Chatly message</div></div>
      <div class="spacer"></div>
      <button class="round-btn" id="renameContact" title="Rename contact">✎</button>
    </header>
    <section class="messages hidden" id="messages" aria-live="polite"></section>
    <form class="composer-area hidden" id="messageForm">
      <div class="composer"><textarea id="messageInput" rows="1" maxlength="4000" placeholder="iMessage"></textarea><button class="send" type="submit" aria-label="Send">↑</button></div>
    </form>
  </main>
</div>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rfivnjnvliqpehdkqqap.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_ifYAMrdUhuyX-iOZULuP4w_nZx6oQtl";
const $=id=>document.getElementById(id);
let sb,user,profile,mode="login",activeConversation=null,activeContact=null,liveChannel=null,seen=new Set(),conversations=[];
const nickKey="chatly-v2-nicknames";
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function initials(s="U"){return (s.trim()[0]||"U").toUpperCase();}
function setAvatar(el,url,name){el.innerHTML=url?`<img src="${esc(url)}" alt="">`:esc(initials(name));}
function nickname(id,fallback){try{return JSON.parse(localStorage.getItem(nickKey)||"{}")[id]||fallback}catch{return fallback}}
function saveNickname(id,name){let all={};try{all=JSON.parse(localStorage.getItem(nickKey)||"{}")}catch{}all[id]=name;localStorage.setItem(nickKey,JSON.stringify(all));}
function showError(s){$("authError").textContent=s||"";}
function setMode(next){mode=next;$("authTitle").textContent=mode==="login"?"Your conversations, together.":"Join Chatly.";$("authSubtitle").textContent=mode==="login"?"Sign in to your Chatly account.":"Create an account to start messaging.";$("username").classList.toggle("hidden",mode==="login");$("username").required=mode==="signup";$("authSubmit").textContent=mode==="login"?"Sign in":"Create account";$("switchText").textContent=mode==="login"?"New to Chatly?":"Already have an account?";$("authSwitch").textContent=mode==="login"?"Create an account":"Sign in";showError("");}
$("authSwitch").onclick=e=>{e.preventDefault();setMode(mode==="login"?"signup":"login")};
async function start(){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data:{session}}=await sb.auth.getSession();if(session)await enter(session.user);sb.auth.onAuthStateChange(async(event,session)=>{if(event==="SIGNED_IN"&&session&&!user)await enter(session.user);if(event==="SIGNED_OUT")location.reload()});}
$("authForm").onsubmit=async e=>{e.preventDefault();showError("");try{const email=$("email").value.trim(),password=$("password").value;if(mode==="signup"){const username=$("username").value.trim();if(!/^[a-zA-Z0-9_]{3,24}$/.test(username))throw Error("Username must be 3–24 letters, numbers, or underscores.");const {data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});if(error)throw error;if(data.session)await enter(data.user);else showError("Check your email to confirm your account, then sign in.");}else{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await enter(data.user)}}catch(err){showError(err.message||"Something went wrong.")}};
async function enter(authUser){user=authUser;const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).single();if(error)throw error;profile=data;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("myName").textContent=profile.display_name||profile.username;setAvatar($("myAvatar"),profile.avatar_url,profile.display_name||profile.username);await loadConversations();}
function displayName(p){return p?.display_name||p?.username||"Chatly user";}
async function loadConversations(){const {data,error}=await sb.from("conversations").select("id,user_one,user_two,created_at").or(`user_one.eq.${user.id},user_two.eq.${user.id}`).order("created_at",{ascending:false});if(error){$("conversationList").innerHTML=`<div class="empty">Could not load messages: ${esc(error.message)}</div>`;return;}const rows=data||[];const ids=[...new Set(rows.map(c=>c.user_one===user.id?c.user_two:c.user_one))];let profiles={};if(ids.length){const r=await sb.from("profiles").select("id,username,display_name,avatar_url").in("id",ids);if(r.error){console.error(r.error)}else for(const p of r.data||[])profiles[p.id]=p;}conversations=[];for(const c of rows){const other=c.user_one===user.id?c.user_two:c.user_one;const p=profiles[other];if(!p)continue;const {data:last}=await sb.from("direct_messages").select("content,created_at,sender_id").eq("conversation_id",c.id).order("created_at",{ascending:false}).limit(1).maybeSingle();conversations.push({...c,otherId:other,person:p,last});}renderConversations();}
function renderConversations(){const q=$("searchChats").value.trim().toLowerCase();const list=conversations.filter(c=>nickname(c.otherId,displayName(c.person)).toLowerCase().includes(q));$("conversationList").innerHTML=list.length?list.map(c=>{const n=nickname(c.otherId,displayName(c.person));const preview=c.last?(c.last.sender_id===user.id?"You: ":"")+c.last.content:"Start a conversation";const time=c.last?new Date(c.last.created_at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"";return `<div class="conversation ${activeConversation===c.id?"active":""}" data-conv="${c.id}"><div class="avatar" data-avatar="${c.otherId}">${c.person.avatar_url?`<img src="${esc(c.person.avatar_url)}" alt="">`:esc(initials(n))}</div><div class="conv-copy"><div class="conv-top"><span class="conv-name">${esc(n)}</span><span class="conv-time">${time}</span></div><div class="conv-preview">${esc(preview)}</div></div></div>`}).join(""):'<div class="empty"><div><p>No conversations yet.</p><button class="primary" id="listNewChat">Start a chat</button></div></div>';$("conversationList").querySelectorAll("[data-conv]").forEach(el=>el.onclick=()=>openConversation(el.dataset.conv));const btn=$("listNewChat");if(btn)btn.onclick=newChatModal;}
async function newChatModal(){modal("Start a new chat",`<p class="muted small">Enter someone's exact Chatly username.</p><input class="field" id="findUsername" placeholder="Username"><p class="small" id="findError" style="color:#d84a5b"></p><div class="modal-actions"><button class="secondary" id="cancelModal">Cancel</button><button class="primary" id="findPerson">Find person</button></div>`);$("cancelModal").onclick=closeModal;$("findPerson").onclick=async()=>{const name=$("findUsername").value.trim();if(!name)return;$("findError").textContent="Searching…";const {data,error}=await sb.from("profiles").select("id,username,display_name,avatar_url").ilike("username",name).maybeSingle();if(error){$("findError").textContent=error.message;return;}if(!data){$("findError").textContent="No user found with that exact username.";return;}if(data.id===user.id){$("findError").textContent="That's your own username.";return;}const {data:cid,error:ce}=await sb.rpc("chatly_get_or_create_conversation",{p_other_user:data.id});if(ce){$("findError").textContent=ce.message;return;}closeModal();await loadConversations();await openConversation(cid);};}
async function openConversation(id){const c=conversations.find(x=>x.id===id);if(!c)return;activeConversation=id;activeContact=c.person;seen=new Set();$("app").classList.add("chat-open");$("emptyState").classList.add("hidden");$("chatHead").classList.remove("hidden");$("messages").classList.remove("hidden");$("messageForm").classList.remove("hidden");const name=nickname(c.otherId,displayName(c.person));$("chatName").textContent=name;setAvatar($("chatAvatar"),c.person.avatar_url,name);renderConversations();if(liveChannel){sb.removeChannel(liveChannel);liveChannel=null;}await loadMessages(true);liveChannel=sb.channel("dm-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"direct_messages",filter:"conversation_id=eq."+id},async payload=>{const wasNearBottom=nearBottomNow();const {data}=await sb.from("direct_messages").select("id,content,created_at,sender_id").eq("id",payload.new.id).single();if(data){appendMessage(data);if(wasNearBottom||data.sender_id===user.id)scrollBottom();refreshPreview(id,data);}}).subscribe();}
function nearBottomNow(){const el=$("messages");return el.scrollHeight-el.scrollTop-el.clientHeight<110;}
function scrollBottom(){const el=$("messages");requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight;});}
async function loadMessages(scroll){const {data,error}=await sb.from("direct_messages").select("id,content,created_at,sender_id").eq("conversation_id",activeConversation).order("created_at",{ascending:true}).limit(200);if(error){$("messages").textContent=error.message;return;}$("messages").innerHTML="";seen.clear();(data||[]).forEach(appendMessage);if(scroll)scrollBottom();}
function appendMessage(m){if(seen.has(m.id))return;seen.add(m.id);const row=document.createElement("div");row.className="message-row"+(m.sender_id===user.id?" mine":"");const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=m.content;const time=document.createElement("div");time.className="message-time";time.textContent=new Date(m.created_at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});row.append(bubble,time);$("messages").append(row);}
function refreshPreview(id,m){const c=conversations.find(x=>x.id===id);if(c){c.last=m;renderConversations();}}
$("messageForm").onsubmit=async e=>{e.preventDefault();const content=$("messageInput").value.trim();if(!content||!activeConversation)return;const btn=$("messageForm").querySelector("button");btn.disabled=true;const {error}=await sb.from("direct_messages").insert({conversation_id:activeConversation,sender_id:user.id,content});btn.disabled=false;if(error){alert("Message could not send: "+error.message);return;}$("messageInput").value="";$("messageInput").style.height="auto";};
$("messageInput").addEventListener("input",()=>{const el=$("messageInput");el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px";});
$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("messageForm").requestSubmit();}});
$("searchChats").oninput=renderConversations;
$("newChat").onclick=newChatModal;$("emptyNewChat").onclick=newChatModal;
$("backToChats").onclick=()=>{$("app").classList.remove("chat-open");};
$("renameContact").onclick=()=>{const c=conversations.find(x=>x.id===activeConversation);if(!c)return;const old=nickname(c.otherId,displayName(c.person));modal("Rename contact",`<input class="field" id="nicknameInput" maxlength="32" value="${esc(old)}"><div class="modal-actions"><button class="secondary" id="cancelModal">Cancel</button><button class="primary" id="saveNickname">Save</button></div>`);$("cancelModal").onclick=closeModal;$("saveNickname").onclick=()=>{const val=$("nicknameInput").value.trim();if(val)saveNickname(c.otherId,val);closeModal();$("chatName").textContent=val||displayName(c.person);renderConversations();};};
function modal(title,body){$("modalRoot").innerHTML=`<div class="modal-back" id="modalBack"><section class="modal"><h2>${esc(title)}</h2>${body}</section></div>`;$("modalBack").onclick=e=>{if(e.target.id==="modalBack")closeModal();};}
function closeModal(){$("modalRoot").innerHTML="";}
$("settings").onclick=profileModal;
function profileModal(){const dark=document.body.classList.contains("dark");modal("Customize Chatly",`<div class="avatar avatar-preview" id="profilePreview"></div><label class="small muted">Display name</label><input class="field" id="displayNameInput" maxlength="32" value="${esc(profile.display_name||profile.username)}"><label class="small muted">Profile picture</label><input class="field" id="avatarFile" type="file" accept="image/*"><label class="small muted">Appearance</label><div class="theme-row"><button class="theme-choice ${!dark?"selected":""}" id="lightTheme">☀ Light</button><button class="theme-choice ${dark?"selected":""}" id="darkTheme">☾ Dark</button></div><div class="modal-actions"><button class="secondary" id="cancelModal">Cancel</button><button class="primary" id="saveProfile">Save</button></div>`);setAvatar($("profilePreview"),profile.avatar_url,profile.display_name||profile.username);$("cancelModal").onclick=closeModal;$("lightTheme").onclick=()=>setTheme(false);$("darkTheme").onclick=()=>setTheme(true);$("saveProfile").onclick=async()=>{try{const display=$("displayNameInput").value.trim()||profile.username;let avatar_url=profile.avatar_url||null;const file=$("avatarFile").files[0];if(file){if(file.size>4*1024*1024)throw Error("Choose an image under 4 MB.");const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");const path=`${user.id}/${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from("chat-avatars").upload(path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error;avatar_url=sb.storage.from("chat-avatars").getPublicUrl(path).data.publicUrl;}const {data,error}=await sb.from("profiles").update({display_name:display,avatar_url}).eq("id",user.id).select().single();if(error)throw error;profile=data;$("myName").textContent=display;setAvatar($("myAvatar"),avatar_url,display);closeModal();}catch(err){alert("Could not save profile: "+err.message);}};}
function setTheme(dark){document.body.classList.toggle("dark",dark);localStorage.setItem("chatly-theme",dark?"dark":"light");$("lightTheme")?.classList.toggle("selected",!dark);$("darkTheme")?.classList.toggle("selected",dark);}
setTheme(localStorage.getItem("chatly-theme")==="dark");
$("signOut").onclick=()=>sb.auth.signOut();
if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
start().catch(err=>{console.error(err);showError(err.message);});
</script>
</body>
</html>
